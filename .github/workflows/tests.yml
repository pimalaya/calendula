name: Tests

on:
  push:

jobs:
  tests:
    uses: pimalaya/nix/.github/workflows/tests.yml@master
    secrets: inherit
  features:
    # Each backend builds alone, so clippy and the tests run over every
    # feature set a packager may pick, one cache for all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy and the tests over every feature set
        run: |
          set -e
          sets=(
            ""
            "--all-features"
            "--no-default-features --features rustls-ring"
            "--no-default-features --features native-tls,caldav"
            "--no-default-features --features rustls-aws,caldav"
            "--no-default-features --features rustls-ring,vdir,pimdir"
          )
          for backend in caldav gcal msgraph vdir pimdir; do
            sets+=("--no-default-features --features rustls-ring,$backend")
          done
          for set in "${sets[@]}"; do
            echo "::group::clippy and tests $set"
            read -ra flags <<< "$set"
            nix develop -c cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
            nix develop -c cargo test --locked "${flags[@]}"
            echo "::endgroup::"
          done
