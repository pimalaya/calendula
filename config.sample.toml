[accounts.example]
default = true				# the account commands run on without -a
#calendar.default = "personal"		# the calendar event and item use without -k

event.list.page-size = 25		# events per page without -s, --from or --to
#event.list.page-size = 0		# every event on one page
item.list.page-size = 25		# items per page without -s
#item.list.page-size = 0		# every item on one page

#item.composer = "$EDITOR"		# the shell line -i edits an item in, its path appended
#item.composer = ["tcal", "edit"]	# a program and its arguments, the path appended

# CalDAV
#
#caldav.server = "https://caldav.example.org"		# the context root the principal walk starts from
##caldav.server = "caldav.example.org:8443"		# a bare authority, over https
##caldav.discover = "example.org"			# in place of server, resolved through RFC 6764 on every run
##caldav.home = "https://caldav.example.org/alice/"	# the calendar home set, over server, skipping discovery
#caldav.auth.basic.username = "alice@example.org"	# HTTP Basic; or bearer.token, or auth = "none"
#caldav.auth.basic.password.command = "exit 127"	# prints the password
##caldav.auth.basic.password.raw = "secret"		# the password itself
#caldav.alpn = ["http/1.1"]				# the ALPN id rustls offers
##caldav.alpn = []					# none
##caldav.tls.provider = "rustls"			# rustls, the build's first TLS otherwise
##caldav.tls.provider = "native-tls"			# the platform's TLS
##caldav.tls.rustls.crypto = "ring"			# rustls on ring, the build's first otherwise
##caldav.tls.rustls.crypto = "aws"			# rustls on aws-lc-rs
##caldav.tls.cert = "/path/to/cert.pem"			# a PEM certificate to trust

# Google Calendar
#
#gcal.auth.token.command = ["ortie", "token", "show", "-a", "example"]	# an access token, from Ortie's Google section
##gcal.auth.token.raw = "secret"					# the token itself, short-lived
#
#gcal.alpn = ["http/1.1"]		# the ALPN id rustls offers
##gcal.alpn = []			# none
##gcal.tls.provider = "native-tls"	# as caldav.tls
##gcal.tls.rustls.crypto = "aws"	# as caldav.tls.rustls
##gcal.tls.cert = "/path/to/cert.pem"	# as caldav.tls

# Google CalDAV
#
#caldav.server = "https://apidata.googleusercontent.com/caldav/v2/"		# the principal, no .well-known leading there
#caldav.auth.bearer.token.command = ["ortie", "token", "show", "-a", "example"]	# Ortie's Google token, no password taken

