# --------------------------------------------------------------------------------
# Accounts
# --------------------------------------------------------------------------------

[accounts.example]

# When `--account` is missing, use this account as the default one.
default = true

# --------------------------------------------------------------------------------
# Backend selection
#
# An account may carry several backend blocks. The shared commands (`calendar`,
# `event`, `item`) use the first configured one in calendula's priority order:
# vdir, pimdir, caldav, gcal, so a local read is preferred to a network
# round-trip and a protocol-standard server to a vendor API. Pass
# `-b/--backend <name>` to pin one instead. The protocol-specific commands
# (`caldav`, `pimdir`, `vdir`) always use their own.
# --------------------------------------------------------------------------------

# --------------------------------------------------------------------------------
# vdir backend
#
# Local calendar collections stored on disk; see
# <https://vdirsyncer.pimutils.org/en/stable/vdir.html>. Each immediate
# subdirectory of `home-dir` is one calendar. Paths are shell-expanded, so `~`
# and environment variables both work.
# --------------------------------------------------------------------------------

vdir.home-dir = "~/.local/share/vdirsyncer/calendars"

# --------------------------------------------------------------------------------
# pimdir backend
#
# A local pimdir store: an offline cache (a SQLite index plus content-addressed
# blobs) that a sync engine fills; see <https://github.com/pimalaya/pimdir>.
#
# It is a cache, not a server. Calendars come from whatever the sync mirrors, so
# the collection verbs (`calendar create/update/delete`) refuse here. An item
# the sync has listed but not downloaded still shows up, and reading it reports
# "body not fetched" rather than failing. `calendula pimdir status` shows how
# much of each calendar is downloaded.
#
# Writes are staged for the next sync to push, attributed to `source`. Leave it
# unset: a store synced as a single source (the ordinary one-device case) is
# opened as that source. Set it only to disambiguate a store synced from two.
# --------------------------------------------------------------------------------

#pimdir.root = "~/.local/state/neverest/example"
#pimdir.source = "caldav"

# --------------------------------------------------------------------------------
# CalDAV backend
#
# The calendar home set is resolved from the first of these that is set, in
# order of precedence:
#
# 1. `caldav.home`: pre-resolved calendar home set URL; every discovery step is
#    skipped. Fastest, least safe.
# 2. `caldav.server`: principal + home-set discovery start from the given
#    context root. Skips domain resolution.
# 3. `caldav.discover`: a bare domain resolved to a server URL at runtime
#    through RFC 6764 SRV records and `.well-known`, then principal + home-set
#    discovery. Convenient but adds DNS + HTTP round-trips on every run.
#
# The wizard records `server`: discovery already ran once, so pinning what it
# found spares every later run those round-trips.
# --------------------------------------------------------------------------------

#caldav.discover = "example.org"
caldav.server = "https://caldav.example.org/dav/calendars"
#caldav.home = "https://caldav.example.org/dav/calendars/user/me/default"

# Basic authentication (RFC 7617). A `command` secret is a shell command line
# (string, run through the platform shell) or a program + args list; a `raw`
# secret is stored in plaintext.
caldav.auth.basic.username = "username"
caldav.auth.basic.password.command = "pass show example"
#caldav.auth.basic.password.command = ["pass", "show", "example"]
#caldav.auth.basic.password.raw = "password"

# Bearer authentication (RFC 6750), mainly for OAuth 2.0.
#caldav.auth.bearer.token.command = "ortie token show"
#caldav.auth.bearer.token.raw = "oauth2-token"

# TLS configuration.
#caldav.tls.provider = "rustls"
#caldav.tls.rustls.crypto = "ring"
#caldav.tls.cert = "/etc/ssl/certs/ca-certificates.crt"

# --------------------------------------------------------------------------------
# Google Calendar backend
#
# The Calendar API v3, which Google offers in full where its CalDAV bridge is
# crippled: calendars can be created, updated and deleted, and a date range is
# narrowed server-side. There is nothing to discover, so the block is a token
# and a TLS profile.
#
# Google stores events as JSON and exposes no iCalendar representation of one,
# so calendula synthesizes it: what has a well-defined iCalendar slot is
# managed both ways, Google-only fields survive an update untouched, and every
# remaining property is stashed verbatim server-side so it round-trips. Only
# events project; a VTODO or VJOURNAL is refused, since Google models neither.
#
# Calendar ids are the ones `calendula calendar list` shows: your email address
# for the primary calendar, a `...@group.calendar.google.com` value for a
# secondary one. Google mints the id of a calendar it creates, so the id passed
# to `calendar create` is reported back rather than honoured.
#
# An access token expires within the hour, so a token written here is useless by
# the second run: point `command` at a broker such as Ortie.
# --------------------------------------------------------------------------------

# Bearer authentication (RFC 6750), the only kind the Calendar API takes.
#gcal.auth.token.command = "ortie token show"
#gcal.auth.token.command = ["ortie", "token", "show"]
#gcal.auth.token.raw = "oauth2-token"

# TLS configuration.
#gcal.tls.provider = "rustls"
#gcal.tls.rustls.crypto = "ring"
#gcal.tls.cert = "/etc/ssl/certs/ca-certificates.crt"
