#msgraph.user-id = "me"				# the signed-in user's calendars
##msgraph.user-id = "bob@example.org"		# another user's, by id or principal name
#msgraph.alpn = ["http/1.1"]			# the ALPN id rustls offers
##msgraph.alpn = []				# none
##msgraph.tls.provider = "native-tls"		# as caldav.tls
##msgraph.tls.rustls.crypto = "aws"		# as caldav.tls.rustls
##msgraph.tls.cert = "/path/to/cert.pem"	# as caldav.tls

# Fastmail
#
