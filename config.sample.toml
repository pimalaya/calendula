[accounts.example]
default = true			# the account commands run on without -a
#calendar.default = "personal"	# the calendar event commands use without -k

#event.list.page-size = 25	# events per page without -s, --from or --to, 0 for one page [0]
#event.composer = "$EDITOR"	# the shell line -i edits an event in, its path appended, or an argv list (["tcal", "edit"])

#proxy.url = "socks5h://localhost:1080"	# a socks5, socks5h or http proxy for every network backend, all_proxy and https_proxy otherwise [http://localhost:3128]
#proxy.username = "alice"		# its username
#proxy.password.command = "exit 127"	# prints its password

#tls.provider = "rustls"			# the build's first otherwise, for every network backend [native-tls]
#tls.rustls.crypto = "ring"			# the build's first otherwise [aws]
#tls.cert = "/path/to/cert.pem"			# a PEM certificate to trust, the server's leaf under rustls, a root under native-tls
#tls.client.cert = "/path/to/client.pem"	# a PEM client certificate, for mutual TLS
#tls.client.key = "/path/to/client.key.pem"	# its PEM private key, PKCS#8 under native-tls

# CalDAV
#caldav.server = "https://caldav.example.org"	# the context root discovery starts from, a bare authority over https [caldav.example.org:8443, https://example.org/dav/]

#caldav.home = "https://caldav.example.org/alice/"	# the calendar home set, in place of server, skipping discovery

#caldav.auth.basic.username = "alice@example.org"	# HTTP Basic; no auth sends no credential, as auth = "none" does
#caldav.auth.basic.password.command = "exit 127"	# prints the password
#caldav.auth.basic.password.raw = "secret"		# the password itself

#caldav.auth.bearer.token.command = "exit 127"	# HTTP Bearer, prints a token such as an OAuth 2.0 one

# Network, the same keys under jmap, gcal and msgraph
#caldav.alpn = ["http/1.1"]			# the ALPN ids rustls offers, empty for none
#caldav.tls.cert = "/path/to/cert.pem"		# the tls keys, for CalDAV alone, field by field
#caldav.proxy.url = "socks5h://localhost:1080"	# the proxy keys, for CalDAV alone

# JMAP
#jmap.server = "https://jmap.example.org/jmap/session"	# the session URL, or a bare host read through its /.well-known/jmap [jmap.example.org]

#jmap.auth.basic.username = "alice@example.org"	# HTTP Basic
#jmap.auth.basic.password.command = "exit 127"	# prints the password
#jmap.auth.basic.password.raw = "secret"	# the password itself

#jmap.auth.bearer.token.command = "exit 127"	# prints a bearer token; jmap.auth.header.command sends a whole Authorization value

# Google Calendar
#gcal.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token
#gcal.auth.token.raw = "secret"		# the token itself, short-lived

# Microsoft Graph
#msgraph.user-id = "me"				# the signed-in user, another by id or principal name [bob@example.org]
#msgraph.auth.token.command = "exit 127"	# prints an OAuth 2.0 access token
#msgraph.auth.token.raw = "secret"		# the token itself, short-lived

# vdir
#vdir.root = "~/Calendars"	# a directory per calendar, an .ics file per item

# pimdir
#pimdir.root = "/path/to/store"	# the pimdir store a sync engine fills
#pimdir.account = "example"	# the account to read, for a store holding several
