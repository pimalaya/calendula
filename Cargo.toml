[package]
name = "calendula"
description = "CLI to manage calendars"
version = "0.2.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["cli", "calendar", "caldav", "vdir", "ical"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/calendula"

[features]
default = ["rustls-ring", "caldav", "gcal", "msgraph", "vdir", "pimdir", "vendored"]
native-tls = ["pimalaya-stream/native-tls", "io-pim-discovery?/native-tls", "io-webdav?/native-tls", "io-gcal?/native-tls", "io-msgraph?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-pim-discovery?/rustls-aws", "io-webdav?/rustls-aws", "io-gcal?/rustls-aws", "io-msgraph?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-pim-discovery?/rustls-ring", "io-webdav?/rustls-ring", "io-gcal?/rustls-ring", "io-msgraph?/rustls-ring"]
caldav = ["dep:io-webdav", "dep:io-http", "dep:io-pim-discovery", "dep:secrecy", "url/serde"]
gcal = ["dep:io-gcal", "dep:secrecy", "io-gcal/ical"]
msgraph = ["dep:io-msgraph", "dep:secrecy", "io-msgraph/client", "io-msgraph/ical"]
vdir = ["dep:io-vdir"]
pimdir = ["dep:ariadne", "dep:io-pimdir", "io-pimdir/search"]
vendored = ["pimalaya-stream/vendored", "io-webdav?/vendored", "io-gcal?/vendored", "io-msgraph?/vendored", "io-pimdir?/vendored"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.4", default-features = false, features = ["build"] }

[dev-dependencies]
io-oauth = { version = "0.6", default-features = false, features = ["client", "jwt-bearer", "rustls-ring"] }
pimalaya-config = { version = "0.4", default-features = false, features = ["sample"] }
tempfile = { version = "3", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dependencies]
anyhow = { version = "1", default-features = false }
ariadne = { version = "0.6", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "unstable-locales"] }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
getrandom = { version = "0.4", default-features = false }
humansize = { version = "2", default-features = false }
ical-rs = { version = "0.7", default-features = false, features = ["parser", "tzdb"] }
idna_adapter = { version = "=1.0.0", default-features = false }
io-gcal = { version = "0.4", default-features = false, features = ["client"], optional = true }
io-http = { version = "0.7", default-features = false, optional = true }
io-msgraph = { version = "0.8", default-features = false, optional = true }
io-pim-discovery = { version = "0.12", default-features = false, features = ["rfc6764", "stream"], optional = true }
io-pimdir = { version = "0.12", default-features = false, features = ["client"], optional = true }
io-vdir = { version = "0.3", default-features = false, features = ["client"], optional = true }
io-webdav = { version = "0.8", default-features = false, features = ["client"], optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.4", default-features = false, features = ["mcp", "prompt", "repl", "terminal"] }
pimalaya-config = { version = "0.4", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std"] }
schemars = { version = "1", default-features = false, features = ["derive"] }
secrecy = { version = "0.10", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }
unicode-width = { version = "0.2", default-features = false }
url = { version = "2.5", default-features = false }

[patch.crates-io]
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "eb379626e01e31bed11cbe7f06c252262e810279" }
