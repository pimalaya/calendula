[package]
name = "calendula"
description = "CLI to manage calendars"
version = "0.2.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["cli", "calendar", "caldav", "vdir", "ical"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/calendula"

[features]
default = ["rustls-ring", "caldav", "gcal", "msgraph", "vdir", "pimdir", "vendored", "wizard"]
native-tls = ["pimalaya-stream/native-tls", "io-pim-discovery/native-tls", "io-webdav?/native-tls", "io-gcal?/native-tls", "io-msgraph?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-pim-discovery/rustls-aws", "io-webdav?/rustls-aws", "io-gcal?/rustls-aws", "io-msgraph?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-pim-discovery/rustls-ring", "io-webdav?/rustls-ring", "io-gcal?/rustls-ring", "io-msgraph?/rustls-ring"]
caldav = ["dep:io-webdav", "dep:io-http", "dep:secrecy"]
gcal = ["dep:io-gcal", "dep:secrecy", "io-gcal/ical"]
msgraph = ["dep:io-msgraph", "dep:secrecy", "io-msgraph/client", "io-msgraph/ical"]
vdir = ["dep:io-vdir"]
pimdir = ["dep:ariadne", "dep:io-pimdir", "io-pimdir/search"]
vendored = ["pimalaya-stream/vendored", "io-webdav?/vendored", "io-gcal?/vendored", "io-msgraph?/vendored", "io-pimdir?/vendored"]
wizard = ["pimalaya-cli/wizard", "pimalaya-cli/caldav", "pimalaya-cli/spinner"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.3", default-features = false, features = ["build"] }

[dev-dependencies]
tempfile = "3"
toml = "1.1"

[dependencies]
anyhow = "1"
ariadne = { version = "0.6", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "unstable-locales"] }
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.29", default-features = false, features = ["serde"] }
getrandom = "0.4"
humansize = "2"
ical-rs = { version = "0.7", default-features = false, features = ["parser", "tzdb"] }
io-gcal = { version = "0.2", default-features = false, features = ["client"], optional = true }
io-msgraph = { version = "0.6", default-features = false, optional = true }
io-http = { version = "0.6", default-features = false, optional = true }
io-pim-discovery = { version = "0.11", default-features = false, features = ["autoconfig", "pacc", "rfc6764", "stream"] }
io-pimdir = { version = "0.9", default-features = false, features = ["client"], optional = true }
io-vdir = { version = "0.2", default-features = false, features = ["client", "serde"], optional = true }
io-webdav = { version = "0.7", default-features = false, features = ["client"], optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
log = "0.4"
pimalaya-cli = { version = "0.3", default-features = false, features = ["terminal", "table", "prompt"] }
pimalaya-config = { version = "0.3", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std"] }
schemars = "1"
secrecy = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3.1"
unicode-width = "0.2"
url = { version = "2.5", features = ["serde"] }

[patch.crates-io]
ical-rs = { git = "https://github.com/pimalaya/ical", rev = "99b92736a6a076c72936fac29c9b85a5168e4c2f" }
io-gcal = { git = "https://github.com/pimalaya/io-gcal", rev = "90537616dd6d7659c6bfe81df9b4a1428e143f06" }
io-http = { git = "https://github.com/pimalaya/io-http", rev = "e1815307771c1ec65a86b77256d46c33241d3038" }
io-msgraph = { git = "https://github.com/pimalaya/io-msgraph", rev = "2ae26370aefa671c16316dbad98107634436bce6" }
io-pimdir = { git = "https://github.com/pimalaya/io-pimdir", rev = "5c18a026b9c85b470984192452c2aa66e060a3fe" }
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "f976e40cb609194e21cd8df8a089f86a1cd510fd" }
